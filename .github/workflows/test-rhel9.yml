name: Test instalace na RHEL9
# Postavi offline balicek a nainstaluje ho podle README na Rocky Linux 9 (RHEL9 kompatibilni)
# se systemd a podmanem, po instalaci container-tools bez site. Viz test/rhel9-e2e.sh.
on:
  pull_request:
    paths-ignore: ['docs/**', '**.md', 'reference/**']
  workflow_dispatch:

jobs:
  rhel9:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Uvolnit misto na disku
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache && df -h /
      - name: Postavit offline balicek
        run: CTR=docker ./build/build-bundle.sh
      - name: Postavit RPM
        run: sudo apt-get install -y -q rpm && ./build/build-rpm.sh "$(ls dist/netbox-offline-*.tar.gz)"
      - name: Instalace na Rocky Linux 9 a kontroly
        run: ./test/rhel9-e2e.sh "$(ls dist/netbox-offline-*[0-9].sha256 | sed 's/\.sha256$//')"
